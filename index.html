
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Fire Tournament Registration</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

.card {
    width: 100%;
    max-width: 420px;

    padding: 30px;

    background: #1e293b;
    border-radius: 14px;

    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
}

h1 {
    text-align: center;
    color: #38bdf8;
    font-size: 25px;
    margin: 0 0 8px;
}

.subtitle {
    text-align: center;
    color: #94a3b8;
    font-size: 13px;
    margin-bottom: 25px;
}

.group {
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 7px;
    color: #cbd5e1;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 13px;

    border: 1px solid #475569;
    border-radius: 7px;

    background: #0f172a;
    color: white;

    font-size: 16px;
}

input:focus {
    outline: none;
    border-color: #38bdf8;
}

button {
    width: 100%;
    padding: 14px;

    margin-top: 5px;

    border: none;
    border-radius: 7px;

    background: #38bdf8;
    color: #0f172a;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
}

#message {
    margin-top: 16px;
    text-align: center;
    font-size: 14px;
}

.success {
    color: #4ade80;
}

.error {
    color: #f87171;
}
</style>
</head>

<body>

<div class="card">

<h1>🎮 Tournament Registration</h1>

<div class="subtitle">
Player Verification & Registration
</div>

<form id="registrationForm">

<div class="group">
<label for="username">In-game Username</label>

<input
    type="text"
    id="username"
    placeholder="उदा. ProGamer_99"
    required
    autocomplete="off">
</div>

<div class="group">
<label for="uid">In-game UID</label>

<input
    type="text"
    id="uid"
    placeholder="उदा. 87654321"
    required
    autocomplete="off">
</div>

<div class="group">
<label for="facebookName">
Facebook Profile Name
</label>

<input
    type="text"
    id="facebookName"
    placeholder="उदा. Rahul Kumar"
    required
    autocomplete="off">
</div>

<div class="group">
<label for="phone">Phone Number</label>

<input
    type="tel"
    id="phone"
    placeholder="10 अंकों का मोबाइल नंबर"
    maxlength="10"
    inputmode="numeric"
    pattern="[0-9]{10}"
    required
    autocomplete="off">
</div>

<button type="submit" id="submitButton">
Registration Submit करें
</button>

<div id="message"></div>

</form>

</div>

<script>

const form =
document.getElementById("registrationForm");

const button =
document.getElementById("submitButton");

const message =
document.getElementById("message");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const username =
    document.getElementById("username")
    .value
    .trim();

    const uid =
    document.getElementById("uid")
    .value
    .trim();

    const facebookName =
    document.getElementById("facebookName")
    .value
    .trim();

    const phone =
    document.getElementById("phone")
    .value
    .trim();

    if (!/^[0-9]{10}$/.test(phone)) {

        message.textContent =
        "❌ कृपया सही 10 अंकों का मोबाइल नंबर डालें।";

        message.className = "error";

        return;
    }

    button.disabled = true;
    button.textContent = "Submitting...";

    try {

        const response = await fetch("/api/submit", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                username,
                uid,
                facebookName,
                phone
            })

        });

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.message);
        }

        message.textContent =
        "✅ Registration सफलतापूर्वक हो गई!";

        message.className = "success";

        form.reset();

    } catch (error) {

        console.error(error);

        message.textContent =
        "❌ Registration failed. कृपया दोबारा कोशिश करें।";

        message.className = "error";
    }

    button.disabled = false;
    button.textContent =
    "Registration Submit करें";

});

</script>

</body>
</html>
